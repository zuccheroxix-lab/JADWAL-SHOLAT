name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK to GitHub Action Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'ZUCCHERO Waktu Sholat AI v1.0.0' }}
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## 🕌 ZUCCHERO Waktu Sholat AI - Rilis Resmi APK

            Unduh dan pasang file APK pada perangkat Android Anda:
            - 📥 **Download Langsung:** [app-debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}/app-debug.apk)
            
            ### ✨ Fitur Utama:
            - **Retrofit Aladhan API:** Jadwal sholat akurat online via koordinat GPS perangkat.
            - **Deteksi GPS Real-Time:** Menggunakan Google Play Services Fused Location.
            - **Notifikasi Browser & Adzan:** Peringatan adzan dan pre-reminder 10 menit.
            - **Local Logging (Room DB):** Riwayat alarm sholat tersimpan aman offline.
            - **Ekspor WhatsApp:** Format pesan Islami rapi siap kirim ke grup/kontak WA.
            - **Asisten AI Gemini:** Tanya jawab panduan ibadah terintegrasi.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
